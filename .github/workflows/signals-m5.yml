name: Gold Scalper signals M5 (experimental)

on:
  schedule:
    # every 5 min. GitHub may delay a few minutes under load -- the bot
    # tolerates that (it checks the last 3 closed bars).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# allow the job to commit the M5 state file back (so signals aren't re-posted)
permissions:
  contents: write

concurrency:
  group: signals-m5
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run signal bot (M5 -- experimental)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          INTERVAL: "5min"
          STATE_FILE: "last_signal_m5.txt"
        run: python gold_scalper_bot.py

      - name: Persist de-dupe state
        run: |
          if [[ -n "$(git status --porcelain last_signal_m5.txt)" ]]; then
            git config user.name "signal-bot"
            git config user.email "bot@users.noreply.github.com"
            git add last_signal_m5.txt
            git commit -m "state: last M5 signal"
            git pull --rebase --autostash origin main || true
            git push
          fi
